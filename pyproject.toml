[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-toolkit"
version = "0.2.0"
description = "Offensive and defensive AI/LLM security tools, labs and CTF research. Core tools are Python stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "WRG-11" }]
keywords = ["llm-security", "prompt-injection", "owasp-llm-top-10", "ai-security", "red-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Deliberately empty. The core tools import nothing outside the standard
# library, and that is a property worth being able to state in machine-readable
# form rather than only in prose. The extras below are what the non-core parts
# need; see the dependency map in README.
dependencies = []

[project.optional-dependencies]
# labs/rag-security only. The vector store and embedding model are what make
# that lab a RAG lab; nothing else in the repo imports them.
#
# sentence-transformers is not optional here even though chromadb installs
# without it: vulnerable_rag.py:107 asks for
# `embedding_functions.SentenceTransformerEmbeddingFunction`. This extra
# listed chromadb alone while labs/rag-security/requirements.txt listed both,
# so the command the README points at -- `pip install -e ".[rag]"` -- produced
# a lab that died on setup. Two sources of truth, and the documented one was
# the incomplete one.
rag = ["chromadb", "sentence-transformers"]

# huggingface-space/ only -- the hosted demo UI.
hf = ["gradio>=4.0.0"]

# ctf-writeups/agent-odin/ only. The Gandalf solver is stdlib (urllib); the
# three ODIN solvers use requests. Small, but it was the one real dependency
# missing from a README table that called itself the whole map.
ctf = ["requests"]

# Test and lint tooling. Note the runtime stays stdlib-only even here: these
# are measurement tools, not dependencies of the code under test.
dev = ["pytest>=8.0", "coverage>=7.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/WRG-11/ai-security-toolkit"
Issues = "https://github.com/WRG-11/ai-security-toolkit/issues"

[project.scripts]
# The three flagship tools, exposed as commands once installed. Each already
# has an argparse main(); this just saves typing a path.
#
# Constraint worth stating where it is declared: `llm-scanner` and
# `llm-firewall` import their attack corpus and guard implementations from
# labs/vulnllm/, which is NOT packaged (see [tool.setuptools] below). They
# therefore need the repository checkout on disk -- i.e. an editable install --
# and stop with an explanatory error otherwise. Measured 2026-07-29: before
# tools/_lab.py they died at `--help` with a bare `ModuleNotFoundError: No
# module named 'attacks'`.
#
# `prompt-injection-detect` is the exception: the trained model ships as
# package data, so prediction works from a plain wheel; only `--train`
# needs the corpus. tests/test_wheel_install.py holds this split in place.
llm-firewall = "tools.llm_firewall:main"
llm-scanner = "tools.llm_scanner:main"
prompt-injection-detect = "tools.prompt_injection_detector_ml:cli"

[tool.setuptools]
# `tools` is the installable surface. labs/ is deliberately NOT packaged: it is
# a teaching lab meant to be read and run in place, and its modules are
# imported through a sys.path insert rather than as a distribution -- packaging
# it would imply an import contract this repo does not yet offer.
packages = ["tools"]

[tool.setuptools.package-data]
tools = ["models/*.json"]
