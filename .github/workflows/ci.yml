name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # The runtime is stdlib-only by design (dependencies = []), which is
        # exactly the claim an OS matrix can actually test -- ubuntu-only
        # coverage never exercised that on the two platforms it's likeliest
        # to break on (path separators, the demo HTTPServer, encoding
        # defaults). Not previously run anywhere.
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default `run:` to pwsh; the steps below assume
        # bash. GitHub-hosted Windows runners ship git-bash, so pinning the
        # shell keeps all three OSes running identical steps.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The toolkit's RUNTIME is stdlib-only; that property is declared in
      # pyproject as `dependencies = []`. pytest and coverage are measurement
      # tools installed to inspect it, not dependencies of the code under test.
      #
      # pytest rather than `unittest discover`: the suite uses subTest, which
      # unittest folds into its parent while pytest reports separately, so the
      # two runners disagreed on how many tests exist (66 vs 65 + 3 subtests).
      # One runner, one number.
      - name: Install measurement tooling
        run: pip install -e ".[dev]"

      - name: Test + coverage
        run: |
          coverage run -m pytest -q
          coverage report

  # The `test` job installs with `-e`, which keeps the checkout on disk and
  # makes `_PROJECT_ROOT / "labs"` resolve every time -- so it can never see
  # the failure this job exists for. Measured 2026-07-29: from a plain wheel,
  # two of the three console scripts died at `--help` with a bare
  # ModuleNotFoundError. The install path CI exercised was the one that could
  # not fail.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # Builds a venv and installs this repo NON-editable, then asserts the
      # contract: the detector predicts from a wheel (the model is package
      # data), --train exits 2 with an explanation, and the other two tools
      # name the missing directory instead of a module the user never wrote.
      - name: Wheel-install contract
        env:
          RUN_WHEEL_TESTS: "1"
        run: python -m pytest tests/test_wheel_install.py -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff

      # Scope is the whole repo. This step checked only `tools/ tests/` for a
      # long time and passed cleanly while the repository had 148 violations,
      # almost all under labs/ -- i.e. most of the code. A green lint badge
      # represented about a fifth of it. Widening it surfaced one finding that
      # was not stylistic: a Turkish question particle written twice in the
      # perplexity stop-word set while another was missing entirely.
      - run: ruff check .

  mypy:
    # Advisory, not a gate. Measured 2026-08-03: 7 real findings in
    # tools/, all the same shape -- Counter() is typed by typeshed as
    # Dict[K, int] regardless of what you put in it, and
    # prompt_injection_detector_ml.py accumulates float TF-IDF scores in one.
    # Runs correctly (Python does not enforce this at runtime); it is a type
    # annotation mismatch, not a demonstrated functional bug, and fixing it
    # right means widening the annotation across the class rather than
    # silencing each line -- a maintainer call, not this job's to force.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install mypy
      - run: mypy tools/ --ignore-missing-imports

  bandit:
    # Advisory, not a gate -- continue-on-error makes that literal, not just
    # a comment. Measured 2026-08-03: 12 medium-severity findings already
    # exist. Most in labs/ are almost certainly BY DESIGN (labs/vulnllm is a
    # "DVWA for LLMs" -- deliberately-vulnerable teaching code IS the
    # product). The two in tools/ are more interesting: urlopen in
    # llm_scanner.py (the whole point of a network-facing scanner) and
    # HTTPServer bound to 0.0.0.0 in prompt_injection_detector_ml.py's demo
    # server (undocumented -- worth a maintainer look, not this job's call
    # to fail the build over). Complements CodeQL's advanced workflow
    # (Security tab, deeper analysis) with a fast, PR-visible pass instead
    # of replacing it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r tools/ labs/ -ll

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # README's countable claims are resolved from source. This fails if a
      # number drifts -- which is how "21 defense modules" survived in prose
      # while the code had 27. stdlib only, so nothing to install.
      - run: python scripts/readme_stamp.py --check

  # self-scan: re-add when devguard-scan ships a --show-findings flag so
  # findings from intentional vulnerable lab code can be allowlisted separately.
