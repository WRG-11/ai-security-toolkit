version: 2
updates:
  # Root pyproject.toml's own [project.optional-dependencies] (rag/hf/ctf
  # extras: chromadb, sentence-transformers, gradio, requests). These were
  # never tracked by dependabot at all -- only github-actions was -- so a
  # CVE in any of them would have gone unnoticed.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # labs/rag-security and huggingface-space each carry their own
  # requirements.txt, separate from the pyproject extras above -- same gap.
  - package-ecosystem: "pip"
    directory: "/labs/rag-security"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/huggingface-space"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      # codeql-action/init writes a config file that codeql-action/analyze
      # reads back, and the two refuse to run at different versions:
      #   "Loaded a configuration file for version 'X', but running version 'Y'"
      # Ungrouped, Dependabot opened one PR per sub-action (#26 init, #27
      # analyze). Each bumped half the pair, so BOTH failed CI on their own
      # while being correct together -- the errors were exact mirrors of each
      # other. Grouping keeps the pair in a single, mergeable PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
